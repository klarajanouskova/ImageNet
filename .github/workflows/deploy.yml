name: Build and Deploy

on:
  push:
    branches: [hub]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub branch
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          working-directory: blog
          # bundler-cache disabled: it uses --deployment mode which fails when
          # sass-embedded platform binaries get yanked from RubyGems

      - name: Install gems (always resolve fresh)
        run: |
          cd blog
          bundle update sass-embedded
          bundle install --jobs 4

      - name: Build blog with Jekyll
        run: |
          cd blog
          bundle exec jekyll build \
            --config _config.yml \
            --destination ../_deploy/blog
        env:
          JEKYLL_ENV: production

      - name: Add hub page to deploy root
        run: |
          cp index.html _deploy/index.html
          cp config.js  _deploy/config.js
          cp -r images   _deploy/images
          # Static project page: not built by Jekyll, so copy it verbatim.
          # Without this it is missing from the artifact and 404s, even though
          # the hub page links to it.
          cp -r neurips-blog _deploy/neurips-blog

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
